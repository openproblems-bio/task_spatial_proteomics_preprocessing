viash_version: 0.9.7
name: task_spatial_proteomics_preprocessing
organization: openproblems-bio
version: build_main
license: MIT
keywords: [single-cell, openproblems, benchmark, spatial proteomics, multiplexed imaging, preprocessing]
links:
  issue_tracker: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing/issues
  repository: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing
  docker_registry: ghcr.io
label: Spatial Proteomics Preprocessing
summary: Benchmarking preprocessing workflows that turn multiplexed protein images into cell-by-protein matrices.
description: |
  Imaging-based spatial proteomics platforms - CyCIF, CODEX, MIBI, IMC - produce
  multiplexed images in which each channel is an antibody-stained protein marker.
  Turning those images into cell-level protein profiles takes a chain of
  preprocessing choices: correcting the image, segmenting cells, aggregating
  pixel intensities per cell, applying quality control, and normalizing. Each
  choice changes the cell-by-protein matrix that every downstream analysis is
  built on, there is no established consensus on which to make, and the effect
  of any single one is rarely reported in isolation.

  This task benchmarks those steps as interchangeable modules. The input is a
  SpatialData Zarr store holding a multichannel image and, optionally, reference
  segmentation labels. The output is a standardized cell-by-protein AnnData
  object together with preprocessing quality metrics. Methods within a module
  share an argument contract, so a run can swap one module while holding the
  rest fixed.

  The metrics are deliberately reference-free wherever possible: they score a
  result against properties the data must satisfy if preprocessing is correct -
  every segmented object should contain nuclear signal, nuclear stains repeated
  across imaging cycles are the same physical nuclei and must agree within a
  cell, markers confined to incompatible lineages should rarely be co-positive,
  and expression should not be explained by how large a cell happened to be.
  This matters because ground-truth segmentation masks are unavailable for most
  real datasets, including the public exemplar this task is developed against.

  The task stops at preprocessing. Cell-type annotation and biological
  interpretation are treated as downstream consumers of the output rather than
  as benchmarked steps.

  The metric implementations live in the `sprotmetrics` package
  (https://github.com/theislab/sprotmetrics); the components here are the Viash
  contracts around them.
references:
  doi:
    # MCMICRO, the source of the exemplar-001 dataset this task is developed against.
    - 10.1038/s41592-021-01308-y
info:
  image: thumbnail.svg
  # No `test_resources` entry yet, deliberately. Nothing has been uploaded to
  # s3://openproblems-data/resources_test/task_spatial_proteomics_preprocessing/,
  # and naming a bucket path that does not exist makes CI's resource-sync step
  # fail with AllAccessDisabled, which skips the component tests entirely - so
  # the task would report red while testing nothing.
  #
  # The component tests do not need it: they build their own synthetic fixtures
  # (src/testing/isp_fixtures.py). Restore the entry when the resources are
  # uploaded:
