name: "run_benchmark"
namespace: "workflows"
version: "build_main"
argument_groups:
- name: "Inputs"
  arguments:
  - type: "file"
    name: "--input_zarr"
    label: "Spatial proteomics dataset"
    summary: "A SpatialData Zarr store holding a registered multiplexed protein image."
    description: "The single input to the benchmark. Every method chain starts here,\
      \ so this is\nthe one format a new dataset has to be converted into.\n\nThe\
      \ store must contain at least one `Images` element with dims `(c, y, x)`\nwhose\
      \ channel coordinate carries the marker names, since the benchmark reports\n\
      per-marker metrics and has no other source for those names. A `Labels` element\n\
      is optional and is read only by the `reference_segmentation` method; without\n\
      it that method cannot run, and the remaining segmentation methods derive their\n\
      masks from the image.\n\n`--image_key` and `--labels_key` select the elements.\
      \ Left unset, the first\nelement of each kind is used, which is unambiguous\
      \ for the single-image stores\nthe benchmark is developed against.\n\n`scripts/create_resources/isp/prepare_exemplar_001.sh`\
      \ builds such a store\nfrom the public MCMICRO `exemplar-001` acquisition, whose\
      \ raw download is\nunstitched tiles rather than a registered mosaic.\n"
    info:
      format:
        type: "spatialdata_zarr"
        images:
        - type: "object"
          name: "image"
          description: "Multiplexed protein image, dims `(c, y, x)`, with marker names\
            \ on the\nchannel coordinate. Any element name is accepted; `image` is\
            \ what the\nbundled conversion script writes.\n"
          required: true
        labels:
        - type: "object"
          name: "cell"
          description: "Reference cell label mask, dims `(y, x)`, integer labels with\
            \ 0 as\nbackground. Required only by `reference_segmentation`.\n"
          required: false
    example:
    - "resources_test/task_spatial_proteomics_preprocessing/exemplar_001/dataset.zarr"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--image_key"
    description: "SpatialData image element to read. If unset, the first image is\
      \ used.\n"
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--labels_key"
    description: "SpatialData labels element read by `reference_segmentation`. If\
      \ unset,\nthe first labels element is used.\n"
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Outputs"
  arguments:
  - type: "file"
    name: "--output_scores"
    description: "One record per (method chain, metric component) run, carrying the\n\
      metric ids and values together with the chain that produced them.\n"
    info: null
    default:
    - "score_uns.yaml"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output_method_configs"
    info: null
    default:
    - "method_configs.yaml"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output_metric_configs"
    info: null
    default:
    - "metric_configs.yaml"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output_dataset_info"
    info: null
    default:
    - "dataset_uns.yaml"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output_task_info"
    info: null
    default:
    - "task_info.yaml"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
- name: "Method selection"
  description: "Which methods run at each step. A method that is not listed in\n`--default_methods`\
    \ is run only in combination with the defaults, so each\nnon-baseline chain differs\
    \ from the baseline in exactly one step.\n\nThese take several values, separated\
    \ by `;` on the command line.\n"
  arguments:
  - type: "string"
    name: "--default_methods"
    description: "One method per step, forming the baseline chain. Every other method\
      \ is\nrun against this baseline.\n"
    info: null
    default:
    - "basic_image_correction"
    - "basic_threshold_segmentation"
    - "mean_intensity_aggregation"
    - "basic_qc_filter"
    - "total_log1p_normalization"
    required: false
    direction: "input"
    multiple: true
    multiple_sep: ";"
  - type: "string"
    name: "--image_correction_methods"
    info: null
    default:
    - "no_image_correction"
    - "basic_image_correction"
    - "flatfield_image_correction"
    required: false
    direction: "input"
    multiple: true
    multiple_sep: ";"
  - type: "string"
    name: "--segmentation_methods"
    description: "`reference_segmentation` is not a default because it needs a `Labels`\n\
      element, which the exemplar this task is developed against does not\nhave. Add\
      \ it when running on a dataset that ships reference masks.\n"
    info: null
    default:
    - "basic_threshold_segmentation"
    - "watershed_expand_segmentation"
    required: false
    direction: "input"
    multiple: true
    multiple_sep: ";"
  - type: "string"
    name: "--aggregation_methods"
    info: null
    default:
    - "mean_intensity_aggregation"
    - "sum_intensity_aggregation"
    - "median_intensity_aggregation"
    required: false
    direction: "input"
    multiple: true
    multiple_sep: ";"
  - type: "string"
    name: "--qc_methods"
    info: null
    default:
    - "no_qc_filter"
    - "basic_qc_filter"
    - "adaptive_quantile_qc_filter"
    required: false
    direction: "input"
    multiple: true
    multiple_sep: ";"
  - type: "string"
    name: "--normalization_methods"
    info: null
    default:
    - "no_normalization"
    - "total_log1p_normalization"
    - "arcsinh_normalization"
    required: false
    direction: "input"
    multiple: true
    multiple_sep: ";"
- name: "Method parameters"
  arguments:
  - type: "file"
    name: "--method_parameters_yaml"
    description: "Optional YAML defining per-method parameter sets and sweeps. Either\
      \ a\ntop-level `parameters:` mapping or the mapping itself:\n\n  parameters:\n\
      \    basic_threshold_segmentation:\n      default:\n        threshold_method:\
      \ otsu\n      sweep:\n        threshold_quantile: [0.85, 0.90, 0.95]\n\nThe\
      \ `default` block changes that method's arguments wherever it runs.\nEach `sweep`\
      \ value becomes its own chain, tagged with a variant name,\nand sweeps are expanded\
      \ only against the baseline for the same reason\nnon-default methods are.\n"
    info: null
    must_exist: true
    create_parent: true
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Metric parameters"
  description: "Metric arguments that have no safe default because they depend on\
    \ the\nantibody panel. Everything else uses the metric components' own defaults.\n"
  arguments:
  - type: "string"
    name: "--nuclear_markers"
    description: "Comma-separated nuclear/DNA marker names. If unset, names matching\n\
      DNA, DAPI or Hoechst are auto-detected.\n"
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--exclusive_pairs"
    description: "Comma-separated mutually exclusive marker pairs as `A:B`, for example\n\
      `ECAD:CD45`. The co-expression metrics stay NaN when unset rather than\nguessing\
      \ for an unknown panel.\n"
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--dilation_iterations"
    description: "How far to grow the masks when sampling proximal background, in\n\
      pixels. Sets how far outside a mask `signal_background` looks, so it\nis the\
      \ one metric parameter worth varying with the segmentation\nmethod.\n"
    info: null
    default:
    - 3
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
resources:
- type: "nextflow_script"
  path: "main.nf"
  is_executable: true
  entrypoint: "run_wf"
- type: "file"
  path: "_viash.yaml"
- type: "file"
  path: "helper.nf"
info:
  label: "Spatial proteomics preprocessing benchmark"
  summary: "End-to-end benchmark workflow for spatial proteomics preprocessing"
  description: "Runs the preprocessing chain\n\n  SpatialData zarr -> image correction\
    \ -> segmentation -> protein\n  aggregation -> QC -> normalization -> metrics\n\
    \nonce per method combination, and collects every metric value into a single\n\
    score file alongside the method and metric configs needed to interpret it.\n\n\
    Which combinations are run is controlled by the method-selection arguments\nrather\
    \ than by editing the workflow. `--default_methods` names one method\nper step;\
    \ a method that is not a default is run only in combination with the\ndefaults,\
    \ so the run varies one step at a time instead of taking the full\ncross-product.\
    \ With the shipped defaults that is 10 chains rather than the\n162 a cross-product\
    \ would give, and each non-baseline chain differs from the\nbaseline in exactly\
    \ one step, which is what makes a difference in a metric\nattributable.\n\nPer-method\
    \ parameters are not workflow arguments. They come from the\ncomponent defaults,\
    \ or from `--method_parameters_yaml`, which can also sweep\none parameter across\
    \ values.\n"
status: "enabled"
