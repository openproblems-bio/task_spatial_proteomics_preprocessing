name: "run_benchmark"
namespace: "workflows"
version: "build_main"
argument_groups:
- name: "Inputs"
  arguments:
  - type: "file"
    name: "--input_zarr"
    description: "Path to a SpatialData Zarr store. Alias in the raw Nextflow script:\
      \ --zarr."
    info: null
    must_exist: true
    create_parent: true
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--zarr"
    description: "Path to a SpatialData Zarr store. Alias for --input_zarr."
    info: null
    must_exist: true
    create_parent: true
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--viash_engine"
    description: "Engine the component executables run under. One of docker or native.\
      \ Components must have been built with the same engine."
    info: null
    default:
    - "docker"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--image_key"
    description: "SpatialData image key to use. If null, the first image is used."
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Image correction"
  arguments:
  - type: "string"
    name: "--image_correction_method"
    description: "Image correction method. One of no_correction, percentile_background,\
      \ or flatfield."
    info: null
    default:
    - "percentile_background"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--background_percentile"
    description: "Per-channel percentile used as background estimate."
    info: null
    default:
    - 1.0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "boolean"
    name: "--rescale_max"
    description: "Whether to rescale every channel to max 1 after correction."
    info: null
    default:
    - false
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--flatfield_sigma"
    description: "Gaussian sigma in pixels for flat-field illumination estimation."
    info: null
    default:
    - 50.0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--flatfield_mode"
    description: "Flat-field correction mode. One of subtract or divide."
    info: null
    default:
    - "subtract"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Segmentation"
  arguments:
  - type: "string"
    name: "--segmentation_method"
    description: "Segmentation method. One of threshold, watershed_expand, or reference."
    info: null
    default:
    - "threshold"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--labels_key"
    description: "SpatialData labels key used by reference segmentation. If null,\
      \ the first labels element is used."
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--nuclei_channel"
    description: "Channel index used for nuclear segmentation."
    info: null
    default:
    - 0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--threshold_method"
    description: "Thresholding strategy used by watershed segmentation. One of quantile\
      \ or otsu."
    info: null
    default:
    - "quantile"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--threshold_quantile"
    description: "Quantile threshold for nuclear segmentation."
    info: null
    default:
    - 0.9
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--smoothing_sigma"
    description: "Gaussian smoothing sigma used by watershed segmentation."
    info: null
    default:
    - 1.0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--segmentation_min_area"
    description: "Minimum segmented object area in pixels."
    info: null
    default:
    - 30
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--hole_area"
    description: "Maximum hole area filled during watershed preprocessing."
    info: null
    default:
    - 64
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--expansion_distance"
    description: "Pixel distance used to expand watershed nuclear labels."
    info: null
    default:
    - 5
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Aggregation"
  arguments:
  - type: "string"
    name: "--aggregation_method"
    description: "Protein aggregation method. One of mean, sum, or median."
    info: null
    default:
    - "mean"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--stat"
    description: "Legacy aggregation statistic. Dedicated aggregation methods use\
      \ --aggregation_method."
    info: null
    default:
    - "mean"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Quality control"
  arguments:
  - type: "string"
    name: "--qc_method"
    description: "QC method. One of no_qc, fixed_threshold, or adaptive_quantile."
    info: null
    default:
    - "fixed_threshold"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--min_area"
    description: "Minimum cell area for fixed-threshold QC."
    info: null
    default:
    - 50
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--min_total"
    description: "Minimum total protein intensity for fixed-threshold QC."
    info: null
    default:
    - 0.0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--area_quantile"
    description: "Lower area quantile used by adaptive quantile QC."
    info: null
    default:
    - 0.05
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--total_quantile"
    description: "Lower total-intensity quantile used by adaptive quantile QC."
    info: null
    default:
    - 0.05
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Normalization"
  arguments:
  - type: "string"
    name: "--normalization_method"
    description: "Normalization method. One of no_normalization, total_log1p, or arcsinh."
    info: null
    default:
    - "total_log1p"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--scale"
    description: "Target total intensity for total-log1p normalization."
    info: null
    default:
    - 10000.0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--cofactor"
    description: "Cofactor used for arcsinh normalization."
    info: null
    default:
    - 5.0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--transform"
    description: "Legacy transform argument kept for backward compatibility."
    info: null
    default:
    - "log1p"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Metrics"
  arguments:
  - type: "double"
    name: "--cov_thr"
    description: "Threshold used for marker coverage computation."
    info: null
    default:
    - 0.1
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--metric_marker_layer"
    description: "Layer evaluated by marker-distribution metrics. If missing, X is\
      \ used."
    info: null
    default:
    - "counts"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--zero_threshold"
    description: "Threshold below which marker values are counted as zero or absent."
    info: null
    default:
    - 0.0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--metric_low_quantile"
    description: "Lower quantile for robust marker dynamic-range metrics."
    info: null
    default:
    - 0.01
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--metric_high_quantile"
    description: "Upper quantile for robust marker dynamic-range metrics."
    info: null
    default:
    - 0.99
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--metric_raw_layer"
    description: "Raw layer used by normalization diagnostics."
    info: null
    default:
    - "counts"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--metric_normalized_layer"
    description: "Normalized layer used by normalization diagnostics."
    info: null
    default:
    - "normalized"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--metric_max_cells"
    description: "Maximum number of cells used by rank-preservation diagnostics. Use\
      \ 0 to disable subsampling."
    info: null
    default:
    - 5000
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--nuclear_markers"
    description: "Comma-separated nuclear marker names for the segmentation-quality\
      \ metrics. If null, names matching DNA, DAPI or Hoechst are auto-detected."
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--exclusive_pairs"
    description: "Comma-separated mutually exclusive marker pairs as A:B. Co-expression\
      \ metrics stay NaN when unset."
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--n_neighbors"
    description: "Neighbours per cell used by the spillover metric."
    info: null
    default:
    - 6
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--metric_covariate"
    description: "obs column treated as the technical covariate."
    info: null
    default:
    - "area"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--metric_n_pcs"
    description: "Principal components correlated against the covariate."
    info: null
    default:
    - 10
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--dilation_iterations"
    description: "Pixels by which masks are grown to sample proximal background."
    info: null
    default:
    - 3
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--norm_percentile"
    description: "Percentile of per-cell intensity used to normalise the signal integral."
    info: null
    default:
    - 95.0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--metric_random_state"
    description: "Random seed used by metric subsampling."
    info: null
    default:
    - 0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Outputs"
  arguments:
  - type: "file"
    name: "--outdir"
    description: "Output directory. Alias for --publish_dir."
    info: null
    default:
    - "results_isp"
    must_exist: true
    create_parent: true
    required: false
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--publish_dir"
    description: "Output directory. Alias for --outdir."
    info: null
    default:
    - "results_isp"
    must_exist: true
    create_parent: true
    required: false
    direction: "output"
    multiple: false
    multiple_sep: ";"
