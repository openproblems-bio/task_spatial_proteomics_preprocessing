name: "reference_segmentation"
namespace: "methods_proteomics_segmentation"
version: "build_main"
argument_groups:
- name: "Arguments"
  arguments:
  - type: "file"
    name: "--input_image"
    description: "Corrected image as numpy array in channel-y-x format. Required for\
      \ image-derived segmentation methods."
    info: null
    must_exist: true
    create_parent: true
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--input_zarr"
    description: "SpatialData Zarr store. Required for reference-label segmentation."
    info: null
    must_exist: true
    create_parent: true
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--labels_key"
    description: "SpatialData labels key to use for reference segmentation. If null,\
      \ the first labels element is used."
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--nuclei_channel"
    description: "Channel index used as nuclear marker for image-derived segmentation."
    info: null
    default:
    - 0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--threshold_method"
    description: "Strategy used to threshold the nuclear channel. One of quantile\
      \ or otsu."
    info: null
    default:
    - "quantile"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--threshold_quantile"
    description: "Quantile used to threshold the nuclear channel."
    info: null
    default:
    - 0.9
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--min_area"
    description: "Minimum object size in pixels."
    info: null
    default:
    - 30
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--smoothing_sigma"
    description: "Gaussian smoothing sigma used by watershed-based segmentation."
    info: null
    default:
    - 1.0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--hole_area"
    description: "Maximum hole area removed from the nuclear foreground mask."
    info: null
    default:
    - 64
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--seed_min_distance"
    description: "Minimum distance between watershed seed points."
    info: null
    default:
    - 5
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--expansion_distance"
    description: "Pixel distance used to expand nuclear labels toward approximate\
      \ cell regions."
    info: null
    default:
    - 5
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output_labels"
    description: "Output segmentation label image as a numpy array."
    info: null
    example:
    - "segmentation_labels.npy"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output_metadata"
    description: "Optional JSON file describing the segmentation method, its parameters,\
      \ and the resulting object count."
    info: null
    example:
    - "segmentation_metadata.json"
    must_exist: true
    create_parent: true
    required: false
    direction: "output"
    multiple: false
    multiple_sep: ";"
resources:
- type: "python_script"
  path: "script.py"
  is_executable: true
label: "Reference label segmentation"
summary: "Use dataset-provided segmentation labels from a SpatialData Zarr store"
description: "Control segmentation method that extracts existing segmentation labels\
  \ from SpatialData.\nThis is useful as an oracle/reference branch when evaluating\
  \ image-derived segmentation methods.\n"
test_resources:
- type: "python_script"
  path: "test_segmentation.py"
  is_executable: true
- type: "file"
  path: "isp_fixtures.py"
info:
  type: "method"
  subtype: "segmentation"
  type_info:
    label: "Proteomics segmentation"
    summary: "Segment cells from corrected spatial proteomics images"
    description: "Produces a cell label image from corrected multichannel protein\
      \ images or from reference labels stored in a SpatialData object.\nThe API is\
      \ intentionally shared by multiple segmentation methods so that benchmark workflows\
      \ can swap methods while preserving standardized outputs.\n"
status: "enabled"
scope:
  image: "public"
  target: "public"
repositories:
- type: "github"
  name: "openproblems"
  repo: "openproblems-bio/openproblems"
  tag: "build/main"
license: "MIT"
links:
  repository: "https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing"
  docker_registry: "ghcr.io"
runners:
- type: "executable"
  id: "executable"
  docker_setup_strategy: "ifneedbepullelsecachedbuild"
- type: "nextflow"
  id: "nextflow"
  directives:
    tag: "$id"
  auto:
    simplifyInput: true
    simplifyOutput: false
    transcript: false
    publish: false
  config:
    labels:
      lowmem: "memory = 20.Gb"
      midmem: "memory = 50.Gb"
      highmem: "memory = 100.Gb"
      lowcpu: "cpus = 5"
      midcpu: "cpus = 15"
      highcpu: "cpus = 30"
      lowtime: "time = 1.h"
      midtime: "time = 4.h"
      hightime: "time = 8.h"
      veryhightime: "time = 24.h"
  debug: false
  container: "docker"
engines:
- type: "docker"
  id: "docker"
  image: "openproblems/base_python:1"
  namespace_separator: "/"
  setup:
  - type: "python"
    user: false
    pypi:
    - "numpy"
    - "spatialdata==0.5.0"
    - "setuptools<81"
    - "zarr<3.0.0"
    upgrade: true
  entrypoint: []
  cmd: null
- type: "native"
  id: "native"
build_info:
  config: "src/methods_proteomics_segmentation/reference_segmentation/config.vsh.yaml"
  runner: "executable"
  engine: "docker|native"
  output: "target/executable/methods_proteomics_segmentation/reference_segmentation"
  executable: "target/executable/methods_proteomics_segmentation/reference_segmentation/reference_segmentation"
  viash_version: "0.9.7"
  git_commit: "d28203004b6da14740dda7fd81f1424a9da28bd8"
  git_remote: "https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing"
package_config:
  name: "task_spatial_proteomics_preprocessing"
  version: "build_main"
  label: "Spatial Proteomics Preprocessing"
  summary: "Benchmarking preprocessing workflows that turn multiplexed protein images\
    \ into cell-by-protein matrices."
  description: "Imaging-based spatial proteomics platforms - CyCIF, CODEX, MIBI, IMC\
    \ - produce\nmultiplexed images in which each channel is an antibody-stained protein\
    \ marker.\nTurning those images into cell-level protein profiles takes a chain\
    \ of\npreprocessing choices: correcting the image, segmenting cells, aggregating\n\
    pixel intensities per cell, applying quality control, and normalizing. Each\n\
    choice changes the cell-by-protein matrix that every downstream analysis is\n\
    built on, there is no established consensus on which to make, and the effect\n\
    of any single one is rarely reported in isolation.\n\nThis task benchmarks those\
    \ steps as interchangeable modules. The input is a\nSpatialData Zarr store holding\
    \ a multichannel image and, optionally, reference\nsegmentation labels. The output\
    \ is a standardized cell-by-protein AnnData\nobject together with preprocessing\
    \ quality metrics. Methods within a module\nshare an argument contract, so a run\
    \ can swap one module while holding the\nrest fixed.\n\nThe metrics are deliberately\
    \ reference-free wherever possible: they score a\nresult against properties the\
    \ data must satisfy if preprocessing is correct -\nevery segmented object should\
    \ contain nuclear signal, nuclear stains repeated\nacross imaging cycles are the\
    \ same physical nuclei and must agree within a\ncell, markers confined to incompatible\
    \ lineages should rarely be co-positive,\nand expression should not be explained\
    \ by how large a cell happened to be.\nThis matters because ground-truth segmentation\
    \ masks are unavailable for most\nreal datasets, including the public exemplar\
    \ this task is developed against.\n\nThe task stops at preprocessing. Cell-type\
    \ annotation and biological\ninterpretation are treated as downstream consumers\
    \ of the output rather than\nas benchmarked steps.\n\nThe metric implementations\
    \ live in the `sprotmetrics` package\n(https://github.com/theislab/sprotmetrics);\
    \ the components here are the Viash\ncontracts around them.\n"
  info:
    image: "thumbnail.svg"
  repositories:
  - type: "github"
    name: "openproblems"
    repo: "openproblems-bio/openproblems"
    tag: "build/main"
  viash_version: "0.9.7"
  source: "src"
  target: "target"
  config_mods:
  - ".runners[.type == \"nextflow\"].config.labels := { lowmem : \"memory = 20.Gb\"\
    , midmem : \"memory = 50.Gb\", highmem : \"memory = 100.Gb\", lowcpu : \"cpus\
    \ = 5\", midcpu : \"cpus = 15\", highcpu : \"cpus = 30\", lowtime : \"time = 1.h\"\
    , midtime : \"time = 4.h\", hightime : \"time = 8.h\", veryhightime : \"time =\
    \ 24.h\" }\n"
  authors:
  - name: "Julius Stein"
    roles:
    - "author"
    info:
      github: "juliusstein77"
  - name: "Sergio Marco Salas"
    roles:
    - "author"
    - "maintainer"
    info:
      github: "sergiomarco25"
  keywords:
  - "single-cell"
  - "openproblems"
  - "benchmark"
  - "spatial proteomics"
  - "multiplexed imaging"
  - "preprocessing"
  license: "MIT"
  organization: "openproblems-bio"
  references:
    doi:
    - "10.1038/s41592-021-01308-y"
  links:
    repository: "https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing"
    docker_registry: "ghcr.io"
    issue_tracker: "https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing/issues"
