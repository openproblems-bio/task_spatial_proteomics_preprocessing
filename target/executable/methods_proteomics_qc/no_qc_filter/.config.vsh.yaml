name: "no_qc_filter"
namespace: "methods_proteomics_qc"
version: "build_main"
argument_groups:
- name: "Arguments"
  arguments:
  - type: "file"
    name: "--input"
    description: "Input AnnData h5ad with per-cell protein intensities."
    info: null
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--min_area"
    description: "Minimum cell area in pixels for fixed-threshold QC."
    info: null
    default:
    - 50
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--min_total"
    description: "Minimum total protein intensity for fixed-threshold QC."
    info: null
    default:
    - 0.0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--area_quantile"
    description: "Lower area quantile used by adaptive quantile QC."
    info: null
    default:
    - 0.05
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--total_quantile"
    description: "Lower total-intensity quantile used by adaptive quantile QC."
    info: null
    default:
    - 0.05
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output"
    description: "Output AnnData h5ad with QC annotations."
    info: null
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
resources:
- type: "python_script"
  path: "script.py"
  is_executable: true
test_resources:
- type: "python_script"
  path: "test_qc.py"
  is_executable: true
- type: "file"
  path: "isp_fixtures.py"
info:
  label: "no_qc_filter"
  summary: "Control QC method that marks all cells as passing QC."
  description: "Baseline/control method for QC benchmarking. It computes total intensity\
    \ and preserves morphology metadata,\nbut sets obs['passed_QC'] to True for every\
    \ segmented object.\n"
  type: "method"
  subtype: "qc_filter"
  type_info:
    label: "Proteomics QC filter"
    summary: "Compute QC annotations for spatial proteomics cell-by-protein matrices"
    description: "Adds quality-control annotations to an AnnData object generated\
      \ from spatial proteomics images.\nImplementations must write obs['passed_QC']\
      \ and store method metadata in uns['qc'].\n"
status: "enabled"
scope:
  image: "public"
  target: "public"
repositories:
- type: "github"
  name: "openproblems"
  repo: "openproblems-bio/openproblems"
  tag: "build/main"
license: "MIT"
links:
  repository: "https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing"
  docker_registry: "ghcr.io"
runners:
- type: "executable"
  id: "executable"
  docker_setup_strategy: "ifneedbepullelsecachedbuild"
engines:
- type: "docker"
  id: "docker"
  image: "openproblems/base_python:1"
  namespace_separator: "/"
  setup:
  - type: "python"
    user: false
    pypi:
    - "anndata>=0.10.0"
    - "numpy"
    - "pandas"
    - "scipy"
    upgrade: true
  entrypoint: []
  cmd: null
- type: "native"
  id: "native"
build_info:
  config: "src/methods_proteomics_qc/no_qc_filter/config.vsh.yaml"
  runner: "executable"
  engine: "docker|native"
  output: "target/executable/methods_proteomics_qc/no_qc_filter"
  executable: "target/executable/methods_proteomics_qc/no_qc_filter/no_qc_filter"
  viash_version: "0.9.7"
  git_commit: "7316b2e16ded7bc0bd03a460c0ebfa09e6d73f90"
  git_remote: "https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing"
package_config:
  name: "task_spatial_proteomics_preprocessing"
  version: "build_main"
  label: "Spatial Proteomics Preprocessing"
  summary: "Benchmarking preprocessing workflows that turn multiplexed protein images\
    \ into cell-by-protein matrices."
  description: "Imaging-based spatial proteomics platforms - CyCIF, CODEX, MIBI, IMC\
    \ - produce\nmultiplexed images in which each channel is an antibody-stained protein\
    \ marker.\nTurning those images into cell-level protein profiles takes a chain\
    \ of\npreprocessing choices: correcting the image, segmenting cells, aggregating\n\
    pixel intensities per cell, applying quality control, and normalizing. Each\n\
    choice changes the cell-by-protein matrix that every downstream analysis is\n\
    built on, there is no established consensus on which to make, and the effect\n\
    of any single one is rarely reported in isolation.\n\nThis task benchmarks those\
    \ steps as interchangeable modules. The input is a\nSpatialData Zarr store holding\
    \ a multichannel image and, optionally, reference\nsegmentation labels. The output\
    \ is a standardized cell-by-protein AnnData\nobject together with preprocessing\
    \ quality metrics. Methods within a module\nshare an argument contract, so a run\
    \ can swap one module while holding the\nrest fixed.\n\nThe metrics are deliberately\
    \ reference-free wherever possible: they score a\nresult against properties the\
    \ data must satisfy if preprocessing is correct -\nevery segmented object should\
    \ contain nuclear signal, nuclear stains repeated\nacross imaging cycles are the\
    \ same physical nuclei and must agree within a\ncell, markers confined to incompatible\
    \ lineages should rarely be co-positive,\nand expression should not be explained\
    \ by how large a cell happened to be.\nThis matters because ground-truth segmentation\
    \ masks are unavailable for most\nreal datasets, including the public exemplar\
    \ this task is developed against.\n\nThe task stops at preprocessing. Cell-type\
    \ annotation and biological\ninterpretation are treated as downstream consumers\
    \ of the output rather than\nas benchmarked steps.\n\nThe metric implementations\
    \ live in the `sprotmetrics` package\n(https://github.com/theislab/sprotmetrics);\
    \ the components here are the Viash\ncontracts around them.\n"
  info:
    image: "thumbnail.svg"
  repositories:
  - type: "github"
    name: "openproblems"
    repo: "openproblems-bio/openproblems"
    tag: "build/main"
  viash_version: "0.9.7"
  source: "src"
  target: "target"
  config_mods:
  - ".runners[.type == \"nextflow\"].config.labels := { lowmem : \"memory = 20.Gb\"\
    , midmem : \"memory = 50.Gb\", highmem : \"memory = 100.Gb\", lowcpu : \"cpus\
    \ = 5\", midcpu : \"cpus = 15\", highcpu : \"cpus = 30\", lowtime : \"time = 1.h\"\
    , midtime : \"time = 4.h\", hightime : \"time = 8.h\", veryhightime : \"time =\
    \ 24.h\" }\n"
  authors:
  - name: "Julius Stein"
    roles:
    - "author"
    info:
      github: "juliusstein77"
  - name: "Sergio Marco Salas"
    roles:
    - "author"
    - "maintainer"
    info:
      github: "sergiomarco25"
  keywords:
  - "single-cell"
  - "openproblems"
  - "benchmark"
  - "spatial proteomics"
  - "multiplexed imaging"
  - "preprocessing"
  license: "MIT"
  organization: "openproblems-bio"
  references:
    doi:
    - "10.1038/s41592-021-01308-y"
  links:
    repository: "https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing"
    docker_registry: "ghcr.io"
    issue_tracker: "https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing/issues"
