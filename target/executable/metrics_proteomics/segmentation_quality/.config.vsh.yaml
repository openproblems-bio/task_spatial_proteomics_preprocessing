  type: "metric"
  subtype: "proteomics_segmentation_quality"
  type_info:
    label: "Proteomics segmentation quality metrics"
    summary: "Score segmentation without reference masks, using known marker biology"
    description: "Segmentation is the central benchmarked step, but the dataset-provided\n\
      reference labels needed to score it directly are often unavailable. These\n\
      metrics exploit properties the data must satisfy if segmentation is\ncorrect,\
      \ so they carry a known good direction without any ground truth:\n\n  - every\
      \ segmented object should contain nuclear signal;\n  - nuclear stains repeated\
      \ across imaging cycles are the same physical\n    nuclei, so within one correctly\
      \ delineated cell they must agree;\n  - markers restricted to mutually exclusive\
      \ lineages should rarely be\n    co-positive in the same cell;\n  - a marker\
      \ positive in one cell should not appear in its neighbours.\n\nReported over\
      \ all cells and over the QC-passing subset.\n"
