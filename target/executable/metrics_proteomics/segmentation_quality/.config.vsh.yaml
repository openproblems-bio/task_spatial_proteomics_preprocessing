name: "segmentation_quality"
namespace: "metrics_proteomics"
version: "build_main"
argument_groups:
- name: "Arguments"
  arguments:
  - type: "file"
    name: "--input"
    description: "Input AnnData with cell-by-protein intensities and, ideally, QC\
      \ annotations."
    info: null
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--layer"
    description: "Layer to evaluate. Falls back to X when absent."
    info: null
    default:
    - "counts"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--nuclear_markers"
    description: "Comma-separated nuclear/DNA marker names. If null, marker names\
      \ matching DNA, DAPI or Hoechst are auto-detected."
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--exclusive_pairs"
    description: "Comma-separated mutually exclusive marker pairs, each as A:B (for\
      \ example ECAD:CD45). Co-expression metrics are NaN when unset, rather than\
      \ guessed for an unknown panel."
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--n_neighbors"
    description: "Neighbours per cell, by centroid distance, used for the spillover\
      \ metric."
    info: null
    default:
    - 6
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--max_cells"
    description: "Subsample cells above this count for the neighbour search. Use 0\
      \ to disable."
    info: null
    default:
    - 20000
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--random_state"
    description: "Random seed used for subsampling."
    info: null
    default:
    - 0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output"
    description: "Output AnnData with uns['metric_ids'] and uns['metric_values']."
    info: null
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
resources:
- type: "python_script"
  path: "script.py"
  is_executable: true
label: "Segmentation quality metrics"
summary: "Reference-free segmentation scores derived from known marker biology"
description: "Scores segmentation without reference masks, using four properties the\
  \ data\nmust satisfy if cells were delineated correctly:\n\n- `dapi_positive_ratio`\
  \ - fraction of objects containing nuclear signal.\n  Every segmented cell should\
  \ have a nucleus, so a low value means objects are\n  being produced that are not\
  \ cells. Higher is better.\n- `replicate_correlation` - agreement between nuclear\
  \ stains repeated across\n  imaging cycles. They image the same physical nuclei,\
  \ so disagreement is\n  direct evidence of mis-segmentation or mis-registration.\
  \ Higher is better.\n- `median_replicate_cv` - the same signal seen per cell: spread\
  \ across the\n  repeated stains within each cell. Lower is better.\n- `mutually_exclusive_coexpression_ratio`\
  \ - how often cells are co-positive\n  for markers restricted to incompatible lineages,\
  \ as a fraction of cells\n  positive for either. Merged or bled masks raise it.\
  \ Lower is better.\n- `spillover_ratio` - intensity in negative cells adjacent to\
  \ a positive cell\n  against negative cells that are not adjacent. Over-expanded\
  \ masks raise it\n  above 1. Lower is better.\n\nPositivity is set per marker by\
  \ Otsu on log1p intensity rather than a fixed\ncutoff, so the metrics survive a\
  \ change of normalization or intensity scale.\nCo-expression is NaN unless `--exclusive_pairs`\
  \ is given, since the correct\npairs depend on the panel.\n"
test_resources:
- type: "python_script"
  path: "test_metrics.py"
  is_executable: true
- type: "file"
  path: "isp_fixtures.py"
info:
