    min: -1
    max: 1
    maximize: true
  - name: "median_replicate_cv"
    label: "Per-cell spread across repeated nuclear stains"
    summary: "Coefficient of variation across the repeated nuclear stains, per cell."
    description: "Coefficient of variation across the repeated nuclear stains, per\
      \ cell.\n\n    The per-cell counterpart of :func:`replicate_correlation`: a\
