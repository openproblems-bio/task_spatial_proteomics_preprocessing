    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--max_cells"
    description: "Subsample cells above this count. Use 0 to disable."
    info: null
    default:
    - 20000
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--random_state"
    description: "Random seed used for subsampling."
    info: null
    default:
    - 0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output"
    description: "Output AnnData with uns['metric_ids'] and uns['metric_values']."
    info: null
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
resources:
- type: "python_script"
  path: "script.py"
  is_executable: true
label: "Technical covariate metrics"
summary: "How much signal is still explained by cell area and by marker brightness"
description: "Aggregation and normalization should leave per-cell profiles reflecting\n\
  biology rather than how large a cell was or how bright its channel is.\n\nThe area\
  \ metrics are reported on **both** layers, suffixed `_counts` and\n`_normalized`.\
  \ The raw layer asks whether aggregation introduced area\ndependence; the normalized\
  \ layer asks whether normalization removed it. Only\nthe raw layer can see the aggregation\
  \ axis: per-cell total normalization\ndivides out exactly the area scaling that\
  \ `sum` aggregation creates, so\nevaluating the normalized layer alone reports `mean`\
  \ and `sum` as identical.\n\n- `variance_explained_by_covariate_{counts,normalized}`\
  \ - mean R² of\n  expression regressed on cell area, linear and logged. Lower is\
  \ better.\n- `max_marker_variance_explained_by_covariate_{counts,normalized}` -\
  \ the worst\n  marker, so a single area-driven channel is not hidden by the panel\
  \ average.\n  Lower is better.\n- `covariate_pc_correlation_{counts,normalized}`\
  \ - mean absolute correlation\n  between the leading principal components and area.\
  \ Lower is better.\n- `mean_variance_correlation` - dependence of per-marker variance\
  \ on\n  per-marker mean, which a variance-stabilising transform should remove.\n\
  \  Lower is better.\n- `marker_variance_evenness` - Shannon entropy of the per-marker\
  \ variance\n  shares, normalised to 0-1. High means variance is spread across the\
  \ panel;\n  low means a few bright markers dominate. Higher is better.\n\nAdapted\
  \ from the scverse hackathon `sprot` prototype\n(`metrics/technical_correction.py`\
  \ and `metrics/protein_contribution.py`).\nCell area replaces the single-cell covariates\
  \ that prototype assumed\n(`total_counts`, `pct_mito`, `batch`), none of which exist\
  \ here; PCA is done\nby SVD rather than scikit-learn to avoid the extra dependency.\n"
test_resources:
- type: "python_script"
  path: "test_metrics.py"
  is_executable: true
- type: "file"
  path: "isp_fixtures.py"
