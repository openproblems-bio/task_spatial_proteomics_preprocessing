    label: "Proteomics technical covariate metrics"
    summary: "How much of the signal is still explained by technical factors"
    description: "Aggregation and normalization are meant to yield per-cell protein\n\
      profiles that reflect biology rather than how large a cell happened to be\n\
      or how bright its mask was. These metrics quantify how far that holds:\n\n \
      \ - variance in expression attributable to cell area;\n  - correlation between\
      \ the leading principal components and cell area;\n  - dependence of per-marker\
      \ variance on per-marker mean, which is what a\n    variance-stabilising transform\
      \ is supposed to remove;\n  - whether variance is spread across the panel or\
      \ dominated by a few\n    bright markers.\n\nAdapted from the scverse hackathon\
      \ `sprot` prototype\n(`metrics/technical_correction.py`, `metrics/protein_contribution.py`),\n\
      with cell area replacing the single-cell covariates it assumed.\n\nReported\
      \ over all cells and over the QC-passing subset.\n"
