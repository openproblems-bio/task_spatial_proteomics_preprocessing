name: "basic"
namespace: "metrics_proteomics"
version: "build_main"
argument_groups:
- name: "Arguments"
  arguments:
  - type: "file"
    name: "--input"
    description: "Input AnnData file with cell-by-protein intensities and QC annotations."
    info: null
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--cov_thr"
    description: "Intensity threshold used for marker coverage computation."
    info: null
    default:
    - 0.1
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--coverage_threshold"
    description: "Backward-compatible alias for --cov_thr."
    info: null
    default:
    - 0.1
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output"
    label: "Score"
    summary: "The metric values one metric component computed for one preprocessing\
      \ chain."
    description: "Output AnnData file with uns['metric_ids'] and uns['metric_values']."
    info:
      format:
        type: "h5ad"
        uns:
        - type: "string"
          name: "metric_ids"
          description: "One or more unique metric identifiers."
          multiple: true
          required: true
        - type: "double"
          name: "metric_values"
          description: "The metric values obtained for the given prediction. Must\
            \ be of the\nsame length as `metric_ids`. A metric whose configuration\
            \ is absent\nfor the panel reports NaN rather than a guess.\n"
          multiple: true
          required: true
        - type: "string"
          name: "metric_group"
          description: "The metric family that produced these values."
          required: false
    example:
    - "resources_test/task_spatial_proteomics_preprocessing/exemplar_001/score.h5ad"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
resources:
- type: "python_script"
  path: "script.py"
  is_executable: true
label: "Basic preprocessing metrics"
summary: "Compute core QC, morphology, intensity, and marker coverage metrics"
description: "Computes a compact summary of the processed cell-by-protein matrix,\
  \ including\nnumber of cells, number of markers, QC pass rate, median cell area,\
  \ median\ntotal raw intensity, and marker coverage.\n"
test_resources:
- type: "python_script"
  path: "test_metrics.py"
  is_executable: true
- type: "file"
  path: "isp_fixtures.py"
info:
  metrics:
  - name: "median_marker_coverage"
    label: "Per-marker detection rate"
    summary: "Fraction of cells whose intensity exceeds `threshold`, per marker."
    description: "Fraction of cells whose intensity exceeds `threshold`, per marker."
    links:
      repository: "https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing"
      docs: "https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing#readme"
    min: 0
    max: 1
    maximize: true
  - name: "median_marker_coverage_qc_pass"
    label: "Per-marker detection rate"
    summary: "Fraction of cells whose intensity exceeds `threshold`, per marker."
    description: "Fraction of cells whose intensity exceeds `threshold`, per marker."
    links:
      repository: "https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing"
      docs: "https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing#readme"
    min: 0
    max: 1
    maximize: true
  - name: "min_marker_coverage"
    label: "Per-marker detection rate"
    summary: "Fraction of cells whose intensity exceeds `threshold`, per marker."
    description: "Fraction of cells whose intensity exceeds `threshold`, per marker."
    links:
      repository: "https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing"
      docs: "https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing#readme"
    min: 0
    max: 1
    maximize: true
  - name: "min_marker_coverage_qc_pass"
    label: "Per-marker detection rate"
    summary: "Fraction of cells whose intensity exceeds `threshold`, per marker."
    description: "Fraction of cells whose intensity exceeds `threshold`, per marker."
    links:
      repository: "https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing"
      docs: "https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing#readme"
    min: 0
    max: 1
    maximize: true
  type: "metric"
  subtype: "proteomics_basic"
  type_info:
    label: "Proteomics basic metrics"
    summary: "Compute basic cell-level QC, morphology, intensity, and marker coverage\
      \ metrics"
    description: "Produces an AnnData object with benchmark metrics stored in uns['metric_ids']\n\
      and uns['metric_values']. This metric family summarizes core preprocessing\n\
      outputs such as cell count, QC pass rate, cell area, total intensity, and\n\
      marker coverage.\n"
status: "enabled"
scope:
  image: "public"
  target: "public"
repositories:
- type: "github"
  name: "openproblems"
  repo: "openproblems-bio/openproblems"
  tag: "build/main"
license: "MIT"
links:
  repository: "https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing"
  docker_registry: "ghcr.io"
runners:
- type: "executable"
  id: "executable"
  docker_setup_strategy: "ifneedbepullelsecachedbuild"
- type: "nextflow"
  id: "nextflow"
  directives:
    tag: "$id"
  auto:
    simplifyInput: true
    simplifyOutput: false
    transcript: false
    publish: false
  config:
    labels:
      lowmem: "memory = 20.Gb"
      midmem: "memory = 50.Gb"
      highmem: "memory = 100.Gb"
      lowcpu: "cpus = 5"
      midcpu: "cpus = 15"
      highcpu: "cpus = 30"
      lowtime: "time = 1.h"
      midtime: "time = 4.h"
      hightime: "time = 8.h"
      veryhightime: "time = 24.h"
  debug: false
  container: "docker"
engines:
- type: "docker"
  id: "docker"
  image: "openproblems/base_python:1"
  namespace_separator: "/"
  setup:
  - type: "python"
    user: false
    pypi:
    - "sprotmetrics==0.1.0"
    - "anndata>=0.10.0"
    - "zarr<3.0.0"
    upgrade: true
  entrypoint: []
  cmd: null
- type: "native"
  id: "native"
build_info:
  config: "src/metrics_proteomics/basic/config.vsh.yaml"
  runner: "executable"
  engine: "docker|native"
  output: "target/executable/metrics_proteomics/basic"
  executable: "target/executable/metrics_proteomics/basic/basic"
  viash_version: "0.9.7"
  git_commit: "d28203004b6da14740dda7fd81f1424a9da28bd8"
  git_remote: "https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing"
package_config:
  name: "task_spatial_proteomics_preprocessing"
  version: "build_main"
  label: "Spatial Proteomics Preprocessing"
  summary: "Benchmarking preprocessing workflows that turn multiplexed protein images\
    \ into cell-by-protein matrices."
  description: "Imaging-based spatial proteomics platforms - CyCIF, CODEX, MIBI, IMC\
    \ - produce\nmultiplexed images in which each channel is an antibody-stained protein\
    \ marker.\nTurning those images into cell-level protein profiles takes a chain\
    \ of\npreprocessing choices: correcting the image, segmenting cells, aggregating\n\
    pixel intensities per cell, applying quality control, and normalizing. Each\n\
    choice changes the cell-by-protein matrix that every downstream analysis is\n\
    built on, there is no established consensus on which to make, and the effect\n\
    of any single one is rarely reported in isolation.\n\nThis task benchmarks those\
    \ steps as interchangeable modules. The input is a\nSpatialData Zarr store holding\
    \ a multichannel image and, optionally, reference\nsegmentation labels. The output\
    \ is a standardized cell-by-protein AnnData\nobject together with preprocessing\
    \ quality metrics. Methods within a module\nshare an argument contract, so a run\
    \ can swap one module while holding the\nrest fixed.\n\nThe metrics are deliberately\
    \ reference-free wherever possible: they score a\nresult against properties the\
    \ data must satisfy if preprocessing is correct -\nevery segmented object should\
    \ contain nuclear signal, nuclear stains repeated\nacross imaging cycles are the\
    \ same physical nuclei and must agree within a\ncell, markers confined to incompatible\
    \ lineages should rarely be co-positive,\nand expression should not be explained\
    \ by how large a cell happened to be.\nThis matters because ground-truth segmentation\
    \ masks are unavailable for most\nreal datasets, including the public exemplar\
    \ this task is developed against.\n\nThe task stops at preprocessing. Cell-type\
    \ annotation and biological\ninterpretation are treated as downstream consumers\
    \ of the output rather than\nas benchmarked steps.\n\nThe metric implementations\
    \ live in the `sprotmetrics` package\n(https://github.com/theislab/sprotmetrics);\
    \ the components here are the Viash\ncontracts around them.\n"
  info:
    image: "thumbnail.svg"
  repositories:
  - type: "github"
    name: "openproblems"
    repo: "openproblems-bio/openproblems"
    tag: "build/main"
  viash_version: "0.9.7"
  source: "src"
  target: "target"
  config_mods:
  - ".runners[.type == \"nextflow\"].config.labels := { lowmem : \"memory = 20.Gb\"\
    , midmem : \"memory = 50.Gb\", highmem : \"memory = 100.Gb\", lowcpu : \"cpus\
    \ = 5\", midcpu : \"cpus = 15\", highcpu : \"cpus = 30\", lowtime : \"time = 1.h\"\
    , midtime : \"time = 4.h\", hightime : \"time = 8.h\", veryhightime : \"time =\
    \ 24.h\" }\n"
  authors:
  - name: "Julius Stein"
    roles:
    - "author"
    info:
      github: "juliusstein77"
  - name: "Sergio Marco Salas"
    roles:
    - "author"
    - "maintainer"
    info:
      github: "sergiomarco25"
  keywords:
  - "single-cell"
  - "openproblems"
  - "benchmark"
  - "spatial proteomics"
  - "multiplexed imaging"
  - "preprocessing"
  license: "MIT"
  organization: "openproblems-bio"
  references:
    doi:
    - "10.1038/s41592-021-01308-y"
  links:
    repository: "https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing"
    docker_registry: "ghcr.io"
    issue_tracker: "https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing/issues"
