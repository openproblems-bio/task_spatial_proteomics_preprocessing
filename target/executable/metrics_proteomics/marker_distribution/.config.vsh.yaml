name: "marker_distribution"
namespace: "metrics_proteomics"
version: "build_main"
argument_groups:
- name: "Arguments"
  arguments:
  - type: "file"
    name: "--input"
    description: "Input AnnData file with cell-by-protein intensities."
    info: null
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--layer"
    description: "Layer to evaluate. If missing, X is used. Use counts for raw marker\
      \ distributions."
    info: null
    default:
    - "counts"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--zero_threshold"
    description: "Values less than or equal to this threshold are counted as zero\
      \ or absent."
    info: null
    default:
    - 0.0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--coverage_threshold"
    description: "Values above this threshold are counted as marker-positive for coverage."
    info: null
    default:
    - 0.1
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--low_quantile"
    description: "Lower quantile for robust dynamic-range estimation."
    info: null
    default:
    - 0.01
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--high_quantile"
    description: "Upper quantile for robust dynamic-range estimation."
    info: null
    default:
    - 0.99
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output"
    description: "Output AnnData file with uns['metric_ids'] and uns['metric_values']."
    info: null
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
resources:
- type: "python_script"
  path: "script.py"
  is_executable: true
label: "Marker distribution metrics"
summary: "Compute marker-level intensity, sparsity, coverage, and dynamic-range metrics"
description: "Computes marker-level distribution diagnostics that are useful for comparing\n\
  image correction, segmentation, aggregation, QC, and normalization choices.\n"
test_resources:
- type: "python_script"
  path: "test_metrics.py"
  is_executable: true
- type: "file"
  path: "isp_fixtures.py"
info:
  metrics:
  - name: "median_marker_zero_fraction"
    label: "Per-marker fraction at or below zero"
    summary: "Fraction of cells at or below `threshold`, per marker."
    description: "Fraction of cells at or below `threshold`, per marker."
    links:
      repository: "https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing"
      docs: "https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing#readme"
    min: 0
    max: 1
    maximize: false
  - name: "median_marker_zero_fraction_qc_pass"
    label: "Per-marker fraction at or below zero"
    summary: "Fraction of cells at or below `threshold`, per marker."
    description: "Fraction of cells at or below `threshold`, per marker."
    links:
      repository: "https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing"
      docs: "https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing#readme"
    min: 0
    max: 1
    maximize: false
  - name: "mean_marker_zero_fraction"
