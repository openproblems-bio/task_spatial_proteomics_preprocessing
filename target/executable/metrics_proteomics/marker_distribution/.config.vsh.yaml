    max: "+.inf"
    maximize: true
  type: "metric"
  subtype: "proteomics_marker_distribution"
  type_info:
    label: "Proteomics marker distribution metrics"
    summary: "Compute marker-level sparsity, coverage, intensity, and dynamic-range\
      \ metrics"
    description: "Produces an AnnData object with marker distribution metrics stored\
      \ in\nuns['metric_ids'] and uns['metric_values']. These metrics are useful for\n\
      comparing preprocessing choices that alter marker intensity distributions.\n"
