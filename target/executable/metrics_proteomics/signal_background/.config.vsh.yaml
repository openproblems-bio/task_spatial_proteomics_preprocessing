  type: "metric"
  subtype: "proteomics_signal_background"
  type_info:
    label: "Proteomics signal-versus-background metrics"
    summary: "Score image correction and mask placement against a local background"
    description: "The only metrics in this benchmark computed from pixels rather than\
      \ from\nthe aggregated matrix, and therefore the only ones that can see what\
      \ the\ncell table cannot: how much of each marker's signal actually falls inside\n\
      the masks, and how much of it is background that correction failed to\nremove.\n\
      \nBackground is sampled from a ring immediately outside the masks rather\nthan\
      \ from all non-cell pixels, so the comparison is local and is not\ndominated\
      \ by empty regions of the slide.\n\nAdapted from the scverse hackathon `sprot`\
      \ prototype\n(`metrics/protein_quality_metrics.py`).\n"
