name: "signal_background"
namespace: "metrics_proteomics"
version: "build_main"
argument_groups:
- name: "Arguments"
  arguments:
  - type: "file"
    name: "--input_image"
    description: "Corrected multichannel image as a NumPy array, channels by height\
      \ by width."
    info: null
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--input_labels"
    description: "Segmentation label mask as a two-dimensional NumPy array."
    info: null
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--input_markers"
    description: "JSON file with marker names, either a list or under the key markers."
    info: null
    must_exist: true
    create_parent: true
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--input_qc"
    description: "Optional AnnData carrying obs['passed_QC'], used to report the QC-passing\
      \ variants. Without it those are NaN."
    info: null
    must_exist: true
    create_parent: true
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--dilation_iterations"
    description: "How far to grow the masks when sampling proximal background, in\
      \ pixels."
    info: null
    default:
    - 3
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--norm_percentile"
    description: "Percentile of per-cell intensity used to normalise the signal integral."
    info: null
    default:
    - 95.0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--random_state"
    description: "Random seed for background sampling, which is otherwise irreproducible."
    info: null
    default:
    - 0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output"
    description: "Output AnnData with uns['metric_ids'] and uns['metric_values']."
    info: null
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
resources:
- type: "python_script"
  path: "script.py"
  is_executable: true
label: "Signal versus background metrics"
summary: "Pixel-level scores for image correction and mask placement"
description: "The only metrics computed from pixels rather than the aggregated matrix,\
  \ and\nso the only ones that can see what the cell table cannot: signal that never\n\
  made it inside a mask, and background that correction failed to remove.\n\n- `median_rel_sni`\
  \ / `min_rel_sni` - area between the sorted per-cell\n  intensity curve and a rank-matched\
  \ background curve, normalised by a high\n  percentile of cell intensity. The headline\
  \ signal-to-background measure.\n  Higher is better; `min` exposes the worst marker\
  \ in the panel.\n- `median_intracell_coverage` - among the brightest 5% of cells,\
  \ the fraction\n  of their own pixels above threshold. Separates real staining,\
  \ which is\n  bright *and* extensive, from punctate artefact, which is bright and\
  \ sparse.\n  Higher is better.\n- `median_signal_to_background_ratio` - the simple\
  \ mean-inside over\n  mean-in-ring version. Higher is better.\n- `median_cellular_specificity`\
  \ - positive pixels inside the masks as a share\n  of positive pixels inside plus\
  \ in the ring around them. Higher is better.\n- `median_marker_gini` - concentration\
  \ of per-cell intensity across cells.\n  Descriptive rather than directional: high\
  \ means a marker is restricted to\n  few cells, which is right for a lineage marker\
  \ and wrong for a housekeeper.\n\nBackground is sampled from a ring immediately\
  \ outside the masks, not from all\nnon-cell pixels, so the comparison stays local\
  \ instead of being diluted by\nempty slide.\n\nAdapted from the scverse hackathon\
  \ `sprot` prototype\n(`metrics/protein_quality_metrics.py`). Three changes were\
  \ needed: per-cell\nstatistics are computed by `bincount` instead of masking the\
  \ whole image once\nper cell, positivity uses an Otsu threshold instead of the `thresh=0`\
  \ default\nthat made coverage identically 1.0, and background sampling is seeded\
  \ so the\nresult is reproducible.\n"
test_resources:
- type: "python_script"
  path: "test_signal_background.py"
  is_executable: true
- type: "file"
  path: "isp_fixtures.py"
