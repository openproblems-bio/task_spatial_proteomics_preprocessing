name: run_benchmark
namespace: workflows

info:
  label: "Spatial proteomics preprocessing benchmark"
  summary: "End-to-end benchmark workflow for spatial proteomics preprocessing"
  description: |
    Runs the preprocessing chain

      SpatialData zarr -> image correction -> segmentation -> protein
      aggregation -> QC -> normalization -> metrics

    once per method combination, and collects every metric value into a single
    score file alongside the method and metric configs needed to interpret it.

    Which combinations are run is controlled by the method-selection arguments
    rather than by editing the workflow. `--default_methods` names one method
    per step; a method that is not a default is run only in combination with the
    defaults, so the run varies one step at a time instead of taking the full
    cross-product. With the shipped defaults that is 10 chains rather than the
    162 a cross-product would give, and each non-baseline chain differs from the
    baseline in exactly one step, which is what makes a difference in a metric
    attributable.

    Per-method parameters are not workflow arguments. They come from the
    component defaults, or from `--method_parameters_yaml`, which can also sweep
    one parameter across values.

argument_groups:
  - name: Inputs
    arguments:
      - name: "--input_zarr"
        __merge__: /src/api/file_spatial_proteomics_dataset.yaml
        type: file
        direction: input
        required: true
      - name: "--image_key"
        type: string
        direction: input
        required: false
        description: |
          SpatialData image element to read. If unset, the first image is used.
      - name: "--labels_key"
        type: string
        direction: input
        required: false
        description: |
          SpatialData labels element read by `reference_segmentation`. If unset,
          the first labels element is used.

  - name: Outputs
    arguments:
      - name: "--output_scores"
        type: file
        direction: output
        required: true
        default: score_uns.yaml
        description: |
          One record per (method chain, metric component) run, carrying the
          metric ids and values together with the chain that produced them.
      - name: "--output_method_configs"
        type: file
        direction: output
        required: true
        default: method_configs.yaml
      - name: "--output_metric_configs"
        type: file
        direction: output
        required: true
        default: metric_configs.yaml
      - name: "--output_dataset_info"
        type: file
        direction: output
        required: true
        default: dataset_uns.yaml
      - name: "--output_task_info"
        type: file
        direction: output
        required: true
        default: task_info.yaml

  - name: Method selection
    description: |
      Which methods run at each step. A method that is not listed in
      `--default_methods` is run only in combination with the defaults, so each
      non-baseline chain differs from the baseline in exactly one step.

      These take several values, separated by `;` on the command line.
    arguments:
      - name: "--default_methods"
        type: string
        multiple: true
        description: |
          One method per step, forming the baseline chain. Every other method is
          run against this baseline.
        default: [basic_image_correction, basic_threshold_segmentation, mean_intensity_aggregation, basic_qc_filter, total_log1p_normalization]
      - name: "--image_correction_methods"
        type: string
        multiple: true
        default: [no_image_correction, basic_image_correction, flatfield_image_correction]
      - name: "--segmentation_methods"
        type: string
        multiple: true
        description: |
          `reference_segmentation` is not a default because it needs a `Labels`
          element, which the exemplar this task is developed against does not
          have. Add it when running on a dataset that ships reference masks.
        default: [basic_threshold_segmentation, watershed_expand_segmentation]
      - name: "--aggregation_methods"
        type: string
        multiple: true
        default: [mean_intensity_aggregation, sum_intensity_aggregation, median_intensity_aggregation]
      - name: "--qc_methods"
        type: string
        multiple: true
        default: [no_qc_filter, basic_qc_filter, adaptive_quantile_qc_filter]
      - name: "--normalization_methods"
        type: string
        multiple: true
        default: [no_normalization, total_log1p_normalization, arcsinh_normalization]

  - name: Method parameters
    arguments:
      - name: "--method_parameters_yaml"
        type: file
        direction: input
        required: false
        description: |
          Optional YAML defining per-method parameter sets and sweeps. Either a
          top-level `parameters:` mapping or the mapping itself:

            parameters:
              basic_threshold_segmentation:
                default:
                  threshold_method: otsu
                sweep:
                  threshold_quantile: [0.85, 0.90, 0.95]

          The `default` block changes that method's arguments wherever it runs.
          Each `sweep` value becomes its own chain, tagged with a variant name,
          and sweeps are expanded only against the baseline for the same reason
          non-default methods are.

  - name: Metric parameters
    description: |
      Metric arguments that have no safe default because they depend on the
      antibody panel. Everything else uses the metric components' own defaults.
    arguments:
      - name: "--nuclear_markers"
        type: string
        direction: input
        required: false
        description: |
          Comma-separated nuclear/DNA marker names. If unset, names matching
          DNA, DAPI or Hoechst are auto-detected.
      - name: "--exclusive_pairs"
        type: string
        direction: input
        required: false
        description: |
          Comma-separated mutually exclusive marker pairs as `A:B`, for example
          `ECAD:CD45`. The co-expression metrics stay NaN when unset rather than
          guessing for an unknown panel.
      - name: "--dilation_iterations"
        type: integer
        direction: input
        required: false
        default: 3
        description: |
          How far to grow the masks when sampling proximal background, in
          pixels. Sets how far outside a mask `signal_background` looks, so it
          is the one metric parameter worth varying with the segmentation
          method.

resources:
  - type: nextflow_script
    path: main.nf
    entrypoint: run_wf
  - type: file
    path: /_viash.yaml
  - path: /common/nextflow_helpers/helper.nf

dependencies:
  - name: utils/extract_uns_metadata
    repository: openproblems
  - name: methods_image_correction/no_image_correction
  - name: methods_image_correction/basic_image_correction
  - name: methods_image_correction/flatfield_image_correction
  - name: methods_proteomics_segmentation/basic_threshold_segmentation
  - name: methods_proteomics_segmentation/watershed_expand_segmentation
  - name: methods_proteomics_segmentation/reference_segmentation
  - name: methods_protein_aggregation/mean_intensity_aggregation
  - name: methods_protein_aggregation/sum_intensity_aggregation
  - name: methods_protein_aggregation/median_intensity_aggregation
  - name: methods_proteomics_qc/no_qc_filter
  - name: methods_proteomics_qc/basic_qc_filter
  - name: methods_proteomics_qc/adaptive_quantile_qc_filter
  - name: methods_proteomics_normalization/no_normalization
  - name: methods_proteomics_normalization/total_log1p_normalization
  - name: methods_proteomics_normalization/arcsinh_normalization
  - name: metrics_proteomics/basic
  - name: metrics_proteomics/marker_distribution
  - name: metrics_proteomics/normalization_diagnostics
  - name: metrics_proteomics/segmentation_quality
  - name: metrics_proteomics/technical_covariates
  - name: metrics_proteomics/signal_background

runners:
  - type: nextflow
