__merge__: /src/api/comp_method_proteomics_segmentation.yaml

name: basic_threshold_segmentation
label: "Basic threshold segmentation"
summary: "Simple threshold-based segmentation from a nuclear channel"
description: |
  Baseline image-derived segmentation method.
  It selects a nuclear marker channel, thresholds it using a configurable intensity quantile,
  removes small objects, and converts connected components into cell labels.

arguments:
  - name: "--threshold_method"
    type: string
    direction: input
    required: false
    default: "quantile"
    description: "Strategy used to threshold the nuclear channel. One of quantile or otsu."
  - name: "--threshold_quantile"
    type: double
    direction: input
    required: false
    default: 0.90
    description: "Quantile used to threshold the nuclear channel."
  - name: "--min_area"
    type: integer
    direction: input
    required: false
    default: 30
    description: "Minimum object size in pixels."

resources:
  - type: python_script
    path: script.py
  - path: /src/utils/segmentation_utils.py

engines:
  - type: docker
    image: openproblems/base_python:1
    setup:
      - type: python
        pypi:
          - "numpy"
          - "scikit-image"
          - "zarr<3.0.0"
  - type: native

runners:
  - type: executable
  - type: nextflow
