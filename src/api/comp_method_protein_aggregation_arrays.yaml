namespace: methods_protein_aggregation

info:
  label: "Protein aggregation method from image arrays"
  summary: "Shared interface for aggregating multichannel image intensities into cell-by-protein matrices."
  description: |
    Components implementing this interface take a corrected multichannel image array, a segmentation label mask,
    and marker metadata, and produce an AnnData object containing one row per segmented object and one column per
    protein marker. The interface is designed for benchmarking alternative aggregation strategies such as mean,
    sum, and robust median aggregation.

argument_groups:
  - name: Inputs
    arguments:
      - name: "--input_image"
        type: file
        direction: input
        required: true
        description: "Corrected multichannel image stored as a NumPy array with shape channels by height by width."
      - name: "--input_labels"
        type: file
        direction: input
        required: true
        description: "Segmentation label mask stored as a two-dimensional NumPy array with shape height by width."
      - name: "--input_markers"
        type: file
        direction: input
        required: true
        description: "JSON file containing marker names, either as a list or under the key markers."

  - name: Method parameters
    arguments:
      - name: "--stat"
        type: string
        direction: input
        required: false
        default: "mean"
        description: "Legacy configurable aggregation statistic. Dedicated benchmark methods ignore this argument."

  - name: Outputs
    arguments:
      - name: "--output"
        type: file
        direction: output
        required: true
        description: "Output AnnData file containing the cell-by-protein intensity matrix."

test_resources:
  - type: python_script
    path: /src/testing/test_aggregation.py
  - path: /src/testing/isp_fixtures.py
