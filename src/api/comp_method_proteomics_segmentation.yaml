namespace: methods_proteomics_segmentation
info:
  type: method
  subtype: segmentation
  type_info:
    label: "Proteomics segmentation"
    summary: "Segment cells from corrected spatial proteomics images"
    description: |
      Produces a cell label image from corrected multichannel protein images or from reference labels stored in a SpatialData object.
      The API is intentionally shared by multiple segmentation methods so that benchmark workflows can swap methods while preserving standardized outputs.

      Only the arguments every method understands live here. Method-specific
      hyperparameters are declared in each component's own config.

      Image-derived methods choose their input channels in one of two ways.
      If `--nuclear_markers` (and, for methods that use a cell-boundary channel,
      `--membrane_markers`) are given together with `--input_markers`, the named
      markers are looked up in the marker list. When several markers are named,
      each is rescaled to its 1st-99.8th percentile range and the results are
      max-projected into one channel. Otherwise `--nuclei_channel` selects the
      nuclear channel by index.
arguments:
  - name: "--input_image"
    type: file
    direction: input
    required: false
    description: "Corrected image as numpy array in channel-y-x format. Required for image-derived segmentation methods."
  - name: "--input_markers"
    type: file
    direction: input
    required: false
    example: corrected_markers.json
    description: |
      Marker-name sidecar written by image correction (`{"markers": [...]}`), in
      channel order. Required only when channels are selected by name.
  - name: "--input_zarr"
    type: file
    direction: input
    required: false
    description: "SpatialData Zarr store. Required for reference-label segmentation."
  - name: "--labels_key"
    type: string
    direction: input
    required: false
    default: null
    description: "SpatialData labels key to use for reference segmentation. If null, the first labels element is used."
  - name: "--nuclei_channel"
    type: integer
    direction: input
    required: false
    default: 0
    description: "Channel index used as nuclear marker when `--nuclear_markers` is not given."
  - name: "--nuclear_markers"
    type: string
    direction: input
    required: false
    description: |
      Comma-separated nuclear/DNA marker names, for example `DNA_1,DNA_2`.
      Matched case-insensitively against `--input_markers`. Overrides
      `--nuclei_channel`.
  - name: "--membrane_markers"
    type: string
    direction: input
    required: false
    description: |
      Comma-separated membrane/cytoplasm marker names, for example
      `ECAD,CD45,PanCK`. Used only by methods that segment whole cells from a
      boundary channel (Cellpose, Cellpose-SAM); nuclear-only methods ignore it.
  - name: "--output_labels"
    example: segmentation_labels.npy
    type: file
    direction: output
    required: true
    description: "Output segmentation label image as a numpy array."
  - name: "--output_metadata"
    example: segmentation_metadata.json
    type: file
    direction: output
    required: false
    description: "Optional JSON file describing the segmentation method, its parameters, and the resulting object count."

test_resources:
  - type: python_script
    path: /src/testing/test_segmentation.py
  - path: /src/testing/isp_fixtures.py
