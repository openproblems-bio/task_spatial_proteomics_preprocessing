__merge__: /src/api/comp_method_image_correction.yaml

name: basic_image_correction
label: "Percentile background image correction"
summary: "Per-channel percentile background subtraction for multiplexed spatial proteomics images"
description: |
  Simple image correction baseline:
  - reads image from SpatialData zarr
  - converts image to channel-y-x format
  - subtracts per-channel percentile background
  - clips negative values to zero
  - optionally rescales each channel to max 1

resources:
  - type: python_script
    path: script.py

engines:
  - type: docker
    image: openproblems/base_python:1
    setup:
      - type: python
        pypi:
          - "spatialdata==0.5.0"
          # spatialdata pulls in xarray_schema, which imports pkg_resources
          - "setuptools<81"
          - "zarr<3.0.0"
          - "numpy"
          - "pandas"
          - "xarray"
  - type: native

runners:
  - type: executable
