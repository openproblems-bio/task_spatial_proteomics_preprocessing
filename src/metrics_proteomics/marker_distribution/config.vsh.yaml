      docs: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing#readme
    min: 0
    max: 1
    maximize: false
  - name: median_marker_dynamic_range
    label: Per-marker dynamic range
    summary: High minus low quantile of intensity, per marker.
    description: High minus low quantile of intensity, per marker.
    references: {}
    links:
      repository: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing
      docs: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing#readme
    min: 0
    max: '+.inf'
    maximize: true
  - name: median_marker_dynamic_range_qc_pass
    label: Per-marker dynamic range
    summary: High minus low quantile of intensity, per marker.
    description: High minus low quantile of intensity, per marker.
    references: {}
    links:
      repository: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing
      docs: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing#readme
    min: 0
    max: '+.inf'
    maximize: true
  - name: median_marker_bimodality
    label: Marker positive-population separability
    summary: Separability of the two populations an Otsu split produces, per marker.
    description: "Separability of the two populations an Otsu split produces, per marker.\n\n    ``otsu_variance_ratio``\
      \ is between-class over within-class variance.\n    ``bimodality_index`` is Wang et al. (2009),\
      \ ``sqrt(p(1-p)) * |m1-m2| / sigma``,\n    with both components taken from the Otsu split rather\
      \ than an EM fit; it is\n    the version with a conventional cutoff (roughly BI > 1.1).\n\n    This\
      \ is what image correction and normalization are *for*, and nothing in the\n    benchmark measured\
      \ it."
    references:
      doi:
      - 10.4137/CIN.S2846
    links:
