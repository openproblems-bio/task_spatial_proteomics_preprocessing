    maximize: true
  - name: median_signal_drop_on_aggregation
    label: Positive cells aggregated away to zero
    summary: Cells holding positive pixels whose aggregated value is nonetheless zero, per marker.
    description: "Cells holding positive pixels whose aggregated value is nonetheless zero, per marker.\n\
      \n    Aggregation is the axis the benchmark covers worst, and this asks the\n    question directly:\
      \ did summarising the pixels throw the signal away?\n\n    Rows of `table` are aligned to label\
      \ ids through ``obs[cell_id_key]`` when\n    given, else through integer-castable ``obs_names``,\
      \ else positionally -- and\n    a positional fallback whose length disagrees raises rather than\
      \ scoring a\n    silently mismatched join."
