    min: 0
    max: 1
    maximize: true
  - name: median_signal_to_background_ratio
    label: Mean inside masks over mean in the ring
    summary: Mean intensity inside the masks over mean intensity in the surrounding ring.
    description: "Mean intensity inside the masks over mean intensity in the surrounding ring.\n\n   \
      \ Needs no pseudo-cell sampling, so it survives the cases where the\n    rank-matched curve of :func:`rel_sni`\
      \ cannot be built.\n\n    The division is carried out in the image's own dtype. Multiplexed images\
      \ are\n    stored float32, and under NumPy's weak scalar promotion the benchmark's\n    ``np.mean(image[c][labels\
      \ > 0]) / ring_mean`` stays float32; doing it in\n    float64 is marginally more accurate but shifts\
      \ the result in the eighth\n    significant figure, which would silently move published numbers."
    references: {}
    links:
      repository: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing
      docs: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing#readme
    min: 0
    max: '+.inf'
    maximize: true
  - name: median_signal_to_background_ratio_qc_pass
    label: Mean inside masks over mean in the ring
    summary: Mean intensity inside the masks over mean intensity in the surrounding ring.
    description: "Mean intensity inside the masks over mean intensity in the surrounding ring.\n\n   \
