  - name: median_intracell_coverage
    label: Extent of staining within the brightest cells
    summary: Fraction of its own pixels above threshold, in the most-covered cells, per marker.
    description: "Fraction of its own pixels above threshold, in the most-covered cells, per marker.\n\
      \n    Separates real staining, which is bright *and* extensive, from punctate\n    artefact, which\
      \ is bright and sparse."
    references: {}
    links:
      repository: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing
      docs: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing#readme
    min: 0
    max: 1
    maximize: true
  - name: median_intracell_coverage_qc_pass
    label: Extent of staining within the brightest cells
    summary: Fraction of its own pixels above threshold, in the most-covered cells, per marker.
    description: "Fraction of its own pixels above threshold, in the most-covered cells, per marker.\n\
