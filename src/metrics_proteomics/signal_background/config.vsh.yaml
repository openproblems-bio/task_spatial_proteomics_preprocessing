      docs: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing#readme
    min: 0
    max: '+.inf'
    maximize: true
  - name: median_cellular_specificity
    label: Share of positive pixels falling inside masks
    summary: Positive pixels inside the masks, over positive pixels inside plus in the ring.
    description: Positive pixels inside the masks, over positive pixels inside plus in the ring.
    references: {}
    links:
