__merge__: /src/api/comp_metric_proteomics_signal_background.yaml
name: signal_background
label: Signal versus background metrics
summary: Pixel-level scores for image correction and mask placement
description: "The only metrics computed from pixels rather than the aggregated matrix, and\nso the only\
  \ ones that can see what the cell table cannot: signal that never\nmade it inside a mask, and background\
  \ that correction failed to remove.\n\n- `median_rel_sni` / `min_rel_sni` - area between the sorted\
  \ per-cell\n  intensity curve and a rank-matched background curve, normalised by a high\n  percentile\
  \ of cell intensity. The headline signal-to-background measure.\n  Higher is better; `min` exposes the\
  \ worst marker in the panel.\n- `median_intracell_coverage` - among the brightest 5% of cells, the fraction\n\
  \  of their own pixels above threshold. Separates real staining, which is\n  bright *and* extensive,\
  \ from punctate artefact, which is bright and sparse.\n  Higher is better.\n- `median_signal_to_background_ratio`\
  \ - the simple mean-inside over\n  mean-in-ring version. Higher is better.\n- `median_cellular_specificity`\
  \ - positive pixels inside the masks as a share\n  of positive pixels inside plus in the ring around\
  \ them. Higher is better.\n- `median_marker_gini` - concentration of per-cell intensity across cells.\n\
  \  Descriptive rather than directional: high means a marker is restricted to\n  few cells, which is\
  \ right for a lineage marker and wrong for a housekeeper.\n\nBackground is sampled from a ring immediately\
  \ outside the masks, not from all\nnon-cell pixels, so the comparison stays local instead of being diluted\
  \ by\nempty slide.\n\nAdapted from the scverse hackathon `sprot` prototype\n(`metrics/protein_quality_metrics.py`).\
  \ Three changes were needed: per-cell\nstatistics are computed by `bincount` instead of masking the\
  \ whole image once\nper cell, positivity uses an Otsu threshold instead of the `thresh=0` default\n\
  that made coverage identically 1.0, and background sampling is seeded so the\nresult is reproducible.\n"
resources:
- type: python_script
  path: script.py
engines:
- type: docker
  image: openproblems/base_python:1
  setup:
  - type: python
    pypi:
    - sprotmetrics==0.1.0
    - anndata>=0.10.0
    - zarr<3.0.0
- type: native
runners:
- type: executable
- type: nextflow
info:
  metrics:
  - name: median_rel_sni
    label: Signal integral against a rank-matched background
    summary: Area between the sorted per-cell intensity curve and a rank-matched background curve.
    description: "Area between the sorted per-cell intensity curve and a rank-matched background curve.\n\
      \n    Normalised by a high percentile of cell intensity so markers of different\n    brightness\
      \ are comparable. The headline signal-to-background measure."
    references: {}
    links:
      repository: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing
      docs: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing#readme
    min: '-.inf'
    max: '+.inf'
    maximize: true
  - name: median_rel_sni_qc_pass
    label: Signal integral against a rank-matched background
    summary: Area between the sorted per-cell intensity curve and a rank-matched background curve.
    description: "Area between the sorted per-cell intensity curve and a rank-matched background curve.\n\
