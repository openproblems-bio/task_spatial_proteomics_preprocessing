  - name: nuclear_signal_containment
    label: Nuclear signal falling inside any mask
    summary: Fraction of total nuclear-channel signal that falls inside a mask.
    description: "Fraction of total nuclear-channel signal that falls inside a mask.\n\n    The only way\
      \ to see cells the segmentation missed entirely: every metric\n    computed from the cell table\
      \ is blind to them, because a missed cell is\n    simply absent from the table."
    references: {}
    links:
      repository: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing
      docs: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing#readme
