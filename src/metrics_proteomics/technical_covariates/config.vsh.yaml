__merge__: /src/api/comp_metric_proteomics_technical_covariates.yaml
name: technical_covariates
label: Technical covariate metrics
summary: How much signal is still explained by cell area and by marker brightness
description: "Aggregation and normalization should leave per-cell profiles reflecting\nbiology rather\
  \ than how large a cell was or how bright its channel is.\n\nThe area metrics are reported on **both**\
  \ layers, suffixed `_counts` and\n`_normalized`. The raw layer asks whether aggregation introduced area\n\
  dependence; the normalized layer asks whether normalization removed it. Only\nthe raw layer can see\
  \ the aggregation axis: per-cell total normalization\ndivides out exactly the area scaling that `sum`\
  \ aggregation creates, so\nevaluating the normalized layer alone reports `mean` and `sum` as identical.\n\
  \n- `variance_explained_by_covariate_{counts,normalized}` - mean R² of\n  expression regressed on cell\
  \ area, linear and logged. Lower is better.\n- `max_marker_variance_explained_by_covariate_{counts,normalized}`\
  \ - the worst\n  marker, so a single area-driven channel is not hidden by the panel average.\n  Lower\
  \ is better.\n- `covariate_pc_correlation_{counts,normalized}` - mean absolute correlation\n  between\
  \ the leading principal components and area. Lower is better.\n- `mean_variance_correlation` - dependence\
  \ of per-marker variance on\n  per-marker mean, which a variance-stabilising transform should remove.\n\
  \  Lower is better.\n- `marker_variance_evenness` - Shannon entropy of the per-marker variance\n  shares,\
  \ normalised to 0-1. High means variance is spread across the panel;\n  low means a few bright markers\
  \ dominate. Higher is better.\n\nAdapted from the scverse hackathon `sprot` prototype\n(`metrics/technical_correction.py`\
  \ and `metrics/protein_contribution.py`).\nCell area replaces the single-cell covariates that prototype\
  \ assumed\n(`total_counts`, `pct_mito`, `batch`), none of which exist here; PCA is done\nby SVD rather\
  \ than scikit-learn to avoid the extra dependency.\n"
resources:
- type: python_script
  path: script.py
engines:
- type: docker
  image: openproblems/base_python:1
  setup:
  - type: python
    pypi:
    - sprotmetrics==0.1.0
    - anndata>=0.10.0
    - zarr<3.0.0
- type: native
runners:
- type: executable
- type: nextflow
