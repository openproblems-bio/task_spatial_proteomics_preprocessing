    max: '+.inf'
    maximize: false
  - name: median_tile_cv
    label: Variation of marker intensity across the slide
    summary: Coefficient of variation of a marker's mean across a grid of tiles, per marker.
    description: "Coefficient of variation of a marker's mean across a grid of tiles, per marker.\n\n\
      \    Illumination shading and stitching seams make one region of the slide\n    systematically brighter.\
      \ Real tissue is spatially structured too, so a high\n    value is suggestive rather than conclusive\
      \ -- but a *fall* after flat-field\n    correction is evidence the correction worked."
    references: {}
    links:
