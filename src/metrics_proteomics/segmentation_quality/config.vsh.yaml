__merge__: /src/api/comp_metric_proteomics_segmentation_quality.yaml
name: segmentation_quality
label: Segmentation quality metrics
summary: Reference-free segmentation scores derived from known marker biology
description: "Scores segmentation without reference masks, using four properties the data\nmust satisfy\
  \ if cells were delineated correctly:\n\n- `dapi_positive_ratio` - fraction of objects containing nuclear\
  \ signal.\n  Every segmented cell should have a nucleus, so a low value means objects are\n  being produced\
  \ that are not cells. Higher is better.\n- `replicate_correlation` - agreement between nuclear stains\
  \ repeated across\n  imaging cycles. They image the same physical nuclei, so disagreement is\n  direct\
  \ evidence of mis-segmentation or mis-registration. Higher is better.\n- `median_replicate_cv` - the\
  \ same signal seen per cell: spread across the\n  repeated stains within each cell. Lower is better.\n\
  - `mutually_exclusive_coexpression_ratio` - how often cells are co-positive\n  for markers restricted\
  \ to incompatible lineages, as a fraction of cells\n  positive for either. Merged or bled masks raise\
  \ it. Lower is better.\n- `spillover_ratio` - intensity in negative cells adjacent to a positive cell\n\
  \  against negative cells that are not adjacent. Over-expanded masks raise it\n  above 1. Lower is better.\n\
  \nPositivity is set per marker by Otsu on log1p intensity rather than a fixed\ncutoff, so the metrics\
  \ survive a change of normalization or intensity scale.\nCo-expression is NaN unless `--exclusive_pairs`\
  \ is given, since the correct\npairs depend on the panel.\n"
resources:
- type: python_script
  path: script.py
engines:
- type: docker
  image: openproblems/base_python:1
  setup:
  - type: python
    pypi:
    - sprotmetrics==0.1.0
    - anndata>=0.10.0
    - zarr<3.0.0
- type: native
runners:
- type: executable
info:
  metrics:
  - name: dapi_positive_ratio
    label: Fraction of objects containing nuclear signal
    summary: Fraction of segmented objects positive for the averaged nuclear channels.
    description: "Fraction of segmented objects positive for the averaged nuclear channels.\n\n    Every\
      \ segmented cell should contain a nucleus; objects that do not are debris\n    or mask fragments."
    references: {}
    links:
      repository: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing
      docs: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing#readme
    min: 0
    max: 1
    maximize: true
  - name: dapi_positive_ratio_qc_pass
    label: Fraction of objects containing nuclear signal
    summary: Fraction of segmented objects positive for the averaged nuclear channels.
    description: "Fraction of segmented objects positive for the averaged nuclear channels.\n\n    Every\
      \ segmented cell should contain a nucleus; objects that do not are debris\n    or mask fragments."
    references: {}
    links:
      repository: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing
      docs: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing#readme
    min: 0
    max: 1
    maximize: true
  - name: replicate_correlation
    label: Agreement between repeated nuclear stains
    summary: Mean pairwise correlation between nuclear stains repeated across imaging cycles.
    description: "Mean pairwise correlation between nuclear stains repeated across imaging cycles.\n\n\
      \    The same nuclei imaged twice should agree; disagreement means masks are\n    picking up different\
      \ amounts of each restain."
    references: {}
    links:
      repository: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing
      docs: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing#readme
    min: -1
    max: 1
    maximize: true
  - name: replicate_correlation_qc_pass
    label: Agreement between repeated nuclear stains
    summary: Mean pairwise correlation between nuclear stains repeated across imaging cycles.
    description: "Mean pairwise correlation between nuclear stains repeated across imaging cycles.\n\n\
      \    The same nuclei imaged twice should agree; disagreement means masks are\n    picking up different\
      \ amounts of each restain."
    references: {}
    links:
      repository: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing
      docs: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing#readme
    min: -1
    max: 1
    maximize: true
  - name: median_replicate_cv
    label: Per-cell spread across repeated nuclear stains
    summary: Coefficient of variation across the repeated nuclear stains, per cell.
    description: "Coefficient of variation across the repeated nuclear stains, per cell.\n\n    The per-cell\
      \ counterpart of :func:`replicate_correlation`: a mask that strays\n    off its nucleus picks up\
      \ different amounts of each restain."
    references: {}
    links:
      repository: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing
      docs: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing#readme
    min: 0
    max: '+.inf'
    maximize: false
  - name: median_replicate_cv_qc_pass
    label: Per-cell spread across repeated nuclear stains
    summary: Coefficient of variation across the repeated nuclear stains, per cell.
    description: "Coefficient of variation across the repeated nuclear stains, per cell.\n\n    The per-cell\
      \ counterpart of :func:`replicate_correlation`: a mask that strays\n    off its nucleus picks up\
      \ different amounts of each restain."
    references: {}
    links:
