  - name: mutually_exclusive_coexpression_ratio
    label: Co-positivity of incompatible lineage markers
    summary: Cells co-positive for incompatible markers, over cells positive for either.
    description: "Cells co-positive for incompatible markers, over cells positive for either.\n\n    Normalising\
      \ by the union rather than by all cells stops the value shrinking\n    simply because few cells\
      \ express either marker. A merged mask spanning an\n    epithelial and an immune cell shows up here."
    references: {}
    links:
      repository: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing
      docs: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing#readme
    min: 0
    max: 1
    maximize: false
  - name: mutually_exclusive_coexpression_ratio_qc_pass
    label: Co-positivity of incompatible lineage markers
    summary: Cells co-positive for incompatible markers, over cells positive for either.
    description: "Cells co-positive for incompatible markers, over cells positive for either.\n\n    Normalising\
      \ by the union rather than by all cells stops the value shrinking\n    simply because few cells\
      \ express either marker. A merged mask spanning an\n    epithelial and an immune cell shows up here."
    references: {}
    links:
      repository: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing
      docs: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing#readme
    min: 0
    max: 1
    maximize: false
  - name: spillover_ratio
    label: Signal bleed into neighbouring cells
    summary: Intensity of negative cells touching a positive cell, over those that do not.
    description: "Intensity of negative cells touching a positive cell, over those that do not.\n\n  \
      \  A marker positive in one cell should be absent from its neighbours. Masks\n    that over-expand\
      \ across a boundary raise this above 1."
    references: {}
    links:
      repository: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing
      docs: https://github.com/openproblems-bio/task_spatial_proteomics_preprocessing#readme
    min: 0
    max: '+.inf'
    maximize: false
  - name: spillover_ratio_qc_pass
    label: Signal bleed into neighbouring cells
    summary: Intensity of negative cells touching a positive cell, over those that do not.
    description: "Intensity of negative cells touching a positive cell, over those that do not.\n\n  \
      \  A marker positive in one cell should be absent from its neighbours. Masks\n    that over-expand\
      \ across a boundary raise this above 1."
    references: {}
